<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
   <meta name="viewport" content="width=device-width, initial-scale=1" />
   <meta name="theme-color" content="#0f172a" />
   <meta name="title" content="React File Explorer" />
   <meta
      name="description"
      content="A modern File Explorer built using React, Tailwind CSS, and Drag & Drop."
    />
    <meta
      name="keywords"
      content="React, File Explorer, File Manager, Tailwind, Drag and Drop"
    />
    <meta name="author" content="Geeta Bangde" />
    
    <meta property="og:title" content="React File Explorer" />
    <meta
      property="og:description"
      content="A clean and interactive File Explorer made with React."
    />
    <meta property="og:image" content="%PUBLIC_URL%/preview.png" />
    <meta property="og:type" content="website" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"/>

    <title>File Explorer</title>

    <style>
      body {
        background: #0f172a; /* dark bg */
        margin: 0;
        font-family: 'Inter', sans-serif;
      }

      /* Simple Loader */
      #loader {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 20px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="loader">Loading File Explorer...</div>
    <div id="root"></div>
    <script>
      const observer = new MutationObserver(() => {
        const root = document.getElementById("root").innerHTML;
        if (root.trim() !== "") {
          document.getElementById("loader").style.display = "none";
        }
      });
      observer.observe(document.getElementById("root"), {
        childList: true,
      });
    </script>
  </body>
</html>
